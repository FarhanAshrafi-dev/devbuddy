[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devbuddy"
version = "0.1.0"
description = "A safe, offline-capable AI developer assistant for the terminal"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27.0", "python-dotenv>=1.0.0", "rich>=13.7.0", "pydantic>=2.6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-mock>=3.12.0"]

[project.scripts]
devbuddy = "devbuddy.cli:main"

[tool.setuptools.packages.find]
include = ["devbuddy*"]
